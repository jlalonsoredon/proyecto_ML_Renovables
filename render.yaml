services:
  - type: web
    name: aeropredictor-backend
    rootDir: backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: AEMET_API_KEY
        sync: false
      - key: REE_API_KEY
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      - key: DB_PATH
        value: /app/data/ree_generacion.db
      - key: MODEL_PATH
        value: /app/modelos/lr_eolica.joblib
      - key: METRICS_PATH
        value: /app/modelos/familia_como_modelo.json
    disk:
      - mountPath: /app/data
        name: aeropredictor-data
      - mountPath: /app/modelos
        name: aeropredictor-modelos
